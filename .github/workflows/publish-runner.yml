# Build and publish the Nile-Factory remote runner image to GHCR.
name: Publish runner image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "runner/**"
      - "agent-pipeline-config/modules/aios-agent-aws-migrator/scripts/**"
      - "agent-pipeline-config/modules/aios-agent-aws-migrator/mappings/**"
      - "agent-pipeline-config/modules/aios-agent-aws-migrator/templates/ingest-execute-series-embedded.sh.tftpl"
      - "agent-pipeline-config/modules/aios-agent-aws-migrator/templates/dbsplit-script-pack-env.sh.tftpl"
      - ".github/workflows/publish-runner.yml"
  pull_request:
    paths:
      - "runner/**"
      - "agent-pipeline-config/modules/aios-agent-aws-migrator/scripts/**"
      - "agent-pipeline-config/modules/aios-agent-aws-migrator/mappings/**"
      - "agent-pipeline-config/modules/aios-agent-aws-migrator/templates/ingest-execute-series-embedded.sh.tftpl"
      - "agent-pipeline-config/modules/aios-agent-aws-migrator/templates/dbsplit-script-pack-env.sh.tftpl"
      - ".github/workflows/publish-runner.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-runner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build runner image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pack version
        id: pack
        run: |
          set -euo pipefail
          ver="$(sed -n 's/^SCRIPT_PACK_VERSION="\([^"]*\)"/\1/p' \
            agent-pipeline-config/modules/aios-agent-aws-migrator/scripts/stage-runner.sh | head -n1)"
          test -n "$ver"
          echo "version=${ver}" >> "${GITHUB_OUTPUT}"

      - name: Image name
        id: image
        run: |
          set -euo pipefail
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/${owner}/nile-factory-runner" >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
            type=raw,value=pack-${{ steps.pack.outputs.version }}
            type=raw,value=aiden-0.2.22
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: runner/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
